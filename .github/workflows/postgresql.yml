name: PostgreSQL integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/postgresql.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: div_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: div_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U div_test -d div_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://div_test:ci-test-only@127.0.0.1:5432/div_test
      TEST_DATABASE_URL: postgresql://div_test:ci-test-only@127.0.0.1:5432/div_test
      AUTH_SECRET: ci-only-not-a-production-secret-0123456789
      APP_BASE_URL: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
